services:
  db:
    image: postgres:18
    container_name: rtastats-db
    environment:
      POSTGRES_DB: rtastats
      POSTGRES_USER: ${DB_USERNAME:-rtastats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - rtastats-data:/var/lib/postgresql

volumes:
  rtastats-data: